<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c2d">
  <title>Secret Santa Reveal</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f0e5;
      color: #173c2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 15% 15%, #ffffffb8 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, #ffffffa8 0 2px, transparent 3px),
        #f4f0e5;
      background-size: 90px 90px, 130px 130px, auto;
    }

    main {
      width: min(100%, 34rem);
      padding: clamp(2rem, 8vw, 4rem);
      border: 1px solid #d5c9ad;
      border-radius: 1.25rem;
      background: #fffdf7;
      box-shadow: 0 1.25rem 3rem #173c2c1c;
      text-align: center;
    }

    .holly {
      margin: 0 0 1rem;
      color: #a52c35;
      font-size: 2rem;
      letter-spacing: 0.4rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
    }

    p {
      line-height: 1.6;
    }

    button {
      margin-top: 1rem;
      padding: 0.9rem 1.4rem;
      border: 0;
      border-radius: 999px;
      background: #a52c35;
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 1.05rem;
    }

    button:hover {
      background: #84212a;
    }

    button:focus-visible {
      outline: 3px solid #173c2c;
      outline-offset: 3px;
    }

    #result {
      min-height: 3rem;
      margin-top: 1.5rem;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .error {
      color: #84212a;
      font-size: 1rem !important;
      font-weight: normal !important;
    }
  </style>
</head>
<body>
  <main>
    <p class="holly" aria-hidden="true">✦ ❄ ✦</p>
    <h1>Pukki piilossa!</h1>
    <p>Paina nappia alla, niin saat tietää kenelle tuot lahjan pukin pussiin! </p>
    <button id="reveal" type="button">Tryck för att avslöja min person</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    const revealButton = document.querySelector("#reveal");
    const result = document.querySelector("#result");
    const token = new URLSearchParams(window.location.search).get("p");

    revealButton.addEventListener("click", () => {
      if (!token) {
        result.textContent = "This link is missing its Secret Santa match.";
        result.classList.add("error");
        return;
      }

      try {
        const base64 = token.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
        const bytes = Uint8Array.from(atob(padded), character =>
          character.charCodeAt(0)
        );
        const recipient = new TextDecoder().decode(bytes);
        if (!recipient) {
          throw new Error("Empty match");
        }
        result.textContent = `You’re giving a gift to ${recipient}! 🎁`;
        revealButton.disabled = true;
      } catch {
        result.textContent = "Sorry, this Secret Santa link isn’t valid.";
        result.classList.add("error");
      }
    });
  </script>
</body>
</html>
